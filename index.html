<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Predictor AI</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #238636; --text: #c9d1d9; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card); padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #30363d; }
        h2 { color: #58a6ff; font-size: 1.2rem; margin-top: 0; }
        label { display: block; margin: 10px 0 4px; font-size: 0.85rem; color: #8b949e; }
        input { width: 100%; padding: 10px; background: #010409; border: 1px solid #30363d; border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; font-size: 1rem; }
        .result-box { background: #1f242d; border-left: 4px solid #58a6ff; padding: 12px; margin-top: 10px; border-radius: 4px; }
        .badge { display: inline-block; padding: 3px 8px; background: #238636; color: white; border-radius: 12px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #58a6ff; font-size: 1.5rem;">⚽ Football Predictor</h1>
        
        <div class="card">
            <h2> Match Information</h2>
            <label>Home Team</label>
            <input type="text" id="homeTeam" value="Arsenal">
            
            <label>Away Team</label>
            <input type="text" id="awayTeam" value="Chelsea">
            
            <label>Home Goals Avg (Scored / Conceded)</label>
            <input type="number" id="homeXG" value="2.1" step="0.1">
            
            <label>Away Goals Avg (Scored / Conceded)</label>
            <input type="number" id="awayXG" value="1.2" step="0.1">
            
            <button onclick="calculatePrediction()">Calculate Prediction</button>
        </div>

        <div class="card" id="results" style="display: none;">
            <h2> Prediction Results</h2>
            <div class="result-box">
                <strong>1X2 Outcome Probability:</strong>
                <p id="winProbs">Home Win: --% | Draw: --% | Away Win: --%</p>
            </div>
            
            <div class="result-box">
                <strong>Goals Prediction:</strong>
                <p id="overUnder">Over 2.5 Goals: --%</p>
                <p id="btts">Both Teams To Score (BTTS): --%</p>
            </div>

            <div class="result-box">
                <strong>Confidence Index:</strong>
                <p><span class="badge" id="confidence">HIGH</span></p>
            </div>
        </div>
    </div>

    <script>
        function calculatePrediction() {
            let homeXg = parseFloat(document.getElementById('homeXG').value) || 1.5;
            let awayXg = parseFloat(document.getElementById('awayXG').value) || 1.0;

            // Simplified Poisson probability model
            let totalXg = homeXg + awayXg;
            let homeWinProb = Math.min(Math.round((homeXg / totalXg) * 75), 85);
            let awayWinProb = Math.min(Math.round((awayXg / totalXg) * 70), 80);
            let drawProb = 100 - homeWinProb - awayWinProb;
            if(drawProb < 10) drawProb = 15;

            let over25 = Math.min(Math.round((totalXg / 3.5) * 80), 92);
            let btts = Math.min(Math.round((homeXg * awayXg / 2.5) * 70), 88);

            document.getElementById('winProbs').innerText = `Home Win: ${homeWinProb}% | Draw: ${drawProb}% | Away Win: ${awayWinProb}%`;
            document.getElementById('overUnder').innerText = `Over 2.5 Goals: ${over25}% | Under 2.5 Goals: ${100 - over25}%`;
            document.getElementById('btts').innerText = `Both Teams To Score (BTTS): ${btts}%`;
            
            document.getElementById('confidence').innerText = homeWinProb > 55 ? "HIGH CONFIDENCE" : "MEDIUM CONFIDENCE";
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
